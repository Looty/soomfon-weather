<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title>Weather - Property Inspector</title>
</head>

<body>
    <div class="sdpi-wrapper">
        <div class="row">
            <label for="unit">Unit</label>
            <select id="unit">
                <option value="C">Celsius (°C)</option>
                <option value="F">Fahrenheit (°F)</option>
            </select>
        </div>

        <div class="row">
            <label for="location">Location</label>
            <input id="location" type="text" placeholder="e.g. London" />
        </div>

        <div class="row">
            <label for="background">Background</label>
            <select id="background">
                <option value="black">Black</option>
                <option value="white">White</option>
                <option value="navy">Navy</option>
                <option value="slate">Slate</option>
                <option value="forest">Forest green</option>
                <option value="daynight">Day / night (follows local time)</option>
                <option value="scene">Scene colors (sky gradient)</option>
            </select>
        </div>

        <div class="row hint">
            Type a city name. Weather refreshes every 15 minutes; press the key to refresh now.
        </div>
    </div>

    <script src="index.js"></script>
</body>

<style>
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        background-color: #2a2a2a;
        color: #fff;
        margin: 0;
        padding: 8px;
    }

    .row {
        margin-bottom: 12px;
        display: flex;
        flex-direction: column;
        gap: 4px;
    }

    label {
        font-size: 12px;
        color: #ccc;
    }

    select,
    input {
        background-color: #3a3a3a;
        border: 1px solid #4a4a4a;
        color: #fff;
        border-radius: 4px;
        padding: 6px;
        font-size: 13px;
    }

    .hint {
        font-size: 11px;
        color: #999;
        line-height: 1.4;
    }
</style>

</html>
